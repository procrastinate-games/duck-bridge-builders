name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Physics check (all reference bridges, headless)
        run: npm run sim-check
      - name: Build
        run: npm run build
      - name: Browser tests (headless Chrome)
        run: npm test
